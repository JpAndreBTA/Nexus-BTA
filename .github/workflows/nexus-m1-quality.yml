name: Nexus M1 quality gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'scripts/**'
      - 'crates/**'
      - '.github/workflows/nexus-m1-quality.yml'
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install reproducible frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Security audit (all npm packages)
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Workspace preset unit tests
        run: npm run test:unit
        working-directory: frontend
      - name: Typecheck and production build
        run: npm run check
        working-directory: frontend
        env:
          NEXUS_FRONTEND_BASE: /app/
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile backend source without launching GPU
        run: python -m compileall -q backend/nexus_backend backend/run_backend.py
      - name: Test security guards
        run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path crates/nexus-image-core/Cargo.toml

  browser-smoke:
    # Playwright 1.60's official Chromium runtime is verified for Ubuntu 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Mocked backend browser acceptance (no GPU required)
        working-directory: frontend
        run: |
          npm run dev > /tmp/nexus-smoke-dev.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:3000/ -o /dev/null; then break; fi
            sleep 1
          done
          npm run smoke:m2
